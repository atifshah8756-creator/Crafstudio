<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelCraft Pro Studio - Image & Icon Optimizer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { background: linear-gradient(135deg, #38bdf8, #6366f1); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; font-weight: bold; }
        .logo-text h1 { font-size: 16px; color: #f8fafc; line-height: 1.2; }
        .logo-text span { font-size: 11px; background: #38bdf822; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-weight: 600; }

        .upload-section { border: 2px dashed #38bdf8; border-radius: 12px; padding: 20px; text-align: center; background: #0f172a; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        .upload-section:hover { background: #1e293b; border-color: #7dd3fc; }
        input[type="file"] { display: none; }

        .section-title { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: bold; letter-spacing: 0.5px; margin: 12px 0 6px 0; }
        
        .format-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .btn-format { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; padding: 8px 0; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .btn-format.active { border-color: #38bdf8; background: #172554; color: #38bdf8; }

        .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-preset { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; padding: 8px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; text-align: left; transition: 0.2s; }
        .btn-preset.active { border-color: #38bdf8; background: #172554; color: #38bdf8; font-weight: bold; }
        .btn-preset span { display: block; font-size: 10px; color: #64748b; margin-top: 2px; }

        .slider-group { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; margin-top: 10px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: #94a3b8; }
        input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

        .preview-box { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 15px; }
        canvas { width: 100px; height: 100px; border-radius: 8px; border: 2px solid #38bdf8; background: #000; object-fit: contain; }
        
        .file-info { font-size: 12px; text-align: center; background: #0f172a; padding: 6px; border-radius: 6px; border: 1px solid #334155; width: 100%; }

        .btn-action { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; width: 100%; transition: 0.2s; text-align: center; text-decoration: none; display: block; margin-top: 8px; }
        .btn-action:hover { opacity: 0.9; }
        
        .btn-secondary { background: #334155; color: #f8fafc; font-size: 12px; padding: 10px; margin-top: 5px; }
        .btn-secondary:hover { background: #475569; }

        .security-badge { font-size: 11px; color: #64748b; text-align: center; margin-top: 12px; border-top: 1px solid #334155; padding-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">✨</div>
            <div class="logo-text">
                <h1>PixelCraft</h1>
                <span>Pro Studio</span>
            </div>
        </div>
    </div>

    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
        <p style="color: #cbd5e1; font-weight: 600; font-size: 13px;">📷 Tap to Upload Image</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">

    <div class="section-title">Target Format</div>
    <div class="format-grid">
        <button class="btn-format active" onclick="setFormat('png', this)">PNG</button>
        <button class="btn-format" onclick="setFormat('jpeg', this)">JPG</button>
        <button class="btn-format" onclick="setFormat('webp', this)">WEBP</button>
        <button class="btn-format" onclick="setFormat('ico', this)">ICO</button>
    </div>

    <div class="section-title">Dimension Presets</div>
    <div class="preset-grid">
        <button class="btn-preset active" onclick="setDimensions(512, 512, this)">
            512 × 512
            <span>WebIntoApp / Android</span>
        </button>
        <button class="btn-preset" onclick="setDimensions(192, 192, this)">
            192 × 192
            <span>PWA / Web Launcher</span>
        </button>
    </div>

    <div class="slider-group">
        <div class="slider-header">
            <span>Quality / Compression</span>
            <span id="qualityVal" style="color: #38bdf8; font-weight: bold;">75%</span>
        </div>
        <input type="range" id="qualityRange" min="10" max="95" value="75" oninput="updateQuality(this.value)">
    </div>

    <div class="preview-box">
        <div class="file-info" id="fileInfo">Status: Ready for image upload</div>
        
        <a id="downloadBtn" class="btn-action" download="icon-512x512.png" style="display:none;">Download Optimized File</a>
        <button id="newTabBtn" class="btn-action btn-secondary" onclick="openInNewTab()" style="display:none;">Open Image in New Tab (Long-Press Save)</button>
    </div>

    <div class="security-badge">🔒 100% Secure Client-Side Processing (< 256KB Guaranteed)</div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let currentImage = null;
    let targetWidth = 512;
    let targetHeight = 512;
    let targetFormat = 'png';

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                processAndRender();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function setFormat(fmt, btn) {
        targetFormat = fmt;
        document.querySelectorAll('.btn-format').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        processAndRender();
    }

    function setDimensions(w, h, btn) {
        targetWidth = w;
        targetHeight = h;
        document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        processAndRender();
    }

    function updateQuality(val) {
        document.getElementById('qualityVal').innerText = val + '%';
        processAndRender();
    }

    function processAndRender() {
        if (!currentImage) return;

        const canvas = document.getElementById('canvas');
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, targetWidth, targetHeight);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(currentImage, 0, 0, targetWidth, targetHeight);

        const quality = document.getElementById('qualityRange').value / 100;
        let mimeType = 'image/png';
        if (targetFormat === 'jpeg') mimeType = 'image/jpeg';
        if (targetFormat === 'webp') mimeType = 'image/webp';
        if (targetFormat === 'ico') mimeType = 'image/png';

        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const downloadBtn = document.getElementById('downloadBtn');
            const newTabBtn = document.getElementById('newTabBtn');
            
            downloadBtn.style.display = 'block';
            newTabBtn.style.display = 'block';

            downloadBtn.href = url;
            downloadBtn.download = `app-icon-${targetWidth}x${targetHeight}.${targetFormat}`;

            const sizeKB = (blob.size / 1024).toFixed(1);
            const infoBox = document.getElementById('fileInfo');
            
            if (targetFormat === 'png' && blob.size > 262144) {
                infoBox.innerHTML = `⚠️ Size: ${sizeKB} KB (Over 256KB! Lower slider)`;
                infoBox.style.color = '#f87171';
            } else {
                infoBox.innerHTML = `✅ Size: ${sizeKB} KB (${targetFormat.toUpperCase()} - WebIntoApp Ready!)`;
                infoBox.style.color = '#38bdf8';
            }
        }, mimeType, quality);
    }

    function openInNewTab() {
        const canvas = document.getElementById('canvas');
        let mimeType = 'image/png';
        if (targetFormat === 'jpeg') mimeType = 'image/jpeg';
        if (targetFormat === 'webp') mimeType = 'image/webp';

        const dataUrl = canvas.toDataURL(mimeType);
        const win = window.open();
        win.document.write('<iframe src="' + dataUrl + '" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>');
    }
</script>

</body>
    </html>
